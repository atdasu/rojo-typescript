name: Release

# Pushing a tag such as v1.2.0 checks the project, builds the place file and
# attaches it to a GitHub release with generated notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Node.js and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wally packages
        run: pnpm wally:install

      - name: Format, lint, compile and test
        run: pnpm check

      - name: Build place
        run: pnpm place:build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/*.rbxl --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
